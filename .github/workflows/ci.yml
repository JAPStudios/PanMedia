name: PanMedia CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/agent-management-console

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile panmedia_server.py tests/test_panmedia_server.py
      - name: Run proxy integration tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check script.js
